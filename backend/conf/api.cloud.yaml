app:
  RuntimeRootPath: runtime/
  AbsoluteAppPath: /data/logs/learnerai/runtime/
  LogSavePath: logs/
  LogSaveName: learnerai
  LogFileExt: log
  LogLevel: debug
  TimeFormat: 2006010203
  ExpireTime: 1
  InterfaceTimeOut: 3

server:
  RunMode: debug
  HttpPort: 8099
  ReadTimeout: 60
  WriteTimeout: 60
  ShutDownTimeout: 30
  ConfigPath: /home/ubuntu/NewsInbox/backend/conf
  Env: "online"
